[package]
name = "boomly"
version = "0.1.0"
description = "Boomly — soundpad for Windows"
authors = ["Orion Z43"]
license = "MIT"
repository = "https://github.com/OrionZ43/boomly"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "boomly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# B: audio
cpal = { version = "0.18", features = ["realtime"] }
symphonia = { version = "0.6", default-features = false, features = ["mp3", "wav", "pcm", "ogg", "vorbis", "flac", "adpcm", "id3v1", "id3v2"] }
rubato = "5"
rtrb = "0.4"

# B2: library, hotkeys, system
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# B2: tests
tempfile = "3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
